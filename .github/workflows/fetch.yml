name: fetch-prices

on:
  schedule:
    # 時間為 UTC（週日到週四）＝ 台北時間週一到週五。
    # 程式在美東 16:15 之後才把當天當成美股收盤日：冬令＝台北 05:15、夏令＝台北 04:15。
    # 台北 05:17、05:37、05:47、06:07、06:17、06:37、07:07
    # GitHub 定時排程常延遲數小時或被跳過，多設幾個時段增加準時執行的機會；
    # 另有 Claude 排程在台北 06:43 以 workflow_dispatch 手動觸發作為主要保障。
    - cron: "17 21 * * 0-4"
    - cron: "37 21 * * 0-4"
    - cron: "47 21 * * 0-4"
    - cron: "7 22 * * 0-4"
    - cron: "17 22 * * 0-4"
    - cron: "37 22 * * 0-4"
    - cron: "7 23 * * 0-4"
    # 週六（週報用，抓美股週五收盤）：台北週六 05:37、06:07（UTC 週五）
    - cron: "37 21 * * 5"
    - cron: "7 22 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python scripts/fetch_prices.py
      - name: Commit result
        run: |
          git config user.name "stock-data-bot"
          git config user.email "stock-data-bot@users.noreply.github.com"
          git add data/prices.json data/history.csv data/weekly.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "update prices"
            git pull --rebase
            git push
          fi
