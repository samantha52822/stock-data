name: fetch-prices

on:
  schedule:
    # UTC 23:00 / 23:30（週日到週四）＝ 台北時間週一到週五 07:00 / 07:30
    - cron: "0 23 * * 0-4"
    - cron: "30 23 * * 0-4"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python scripts/fetch_prices.py
      - name: Commit result
        run: |
          git config user.name "stock-data-bot"
          git config user.email "stock-data-bot@users.noreply.github.com"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "update prices"
            git push
          fi
